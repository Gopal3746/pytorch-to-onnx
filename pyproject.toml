[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch-onnx-inference-benchmark"
version = "0.1.0"
description = "CLI benchmark comparing PyTorch eager, ONNX Runtime, and optional torch.compile inference."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
  "onnx>=1.16,<2",
  "onnxruntime>=1.18,<2",
  "onnxscript>=0.2,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
inference-bench = "inference_bench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
